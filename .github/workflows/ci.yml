name: CI - Continuous Integration

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint-and-validate:
    name: Code Quality & Docker Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: HTML Lint Check
        run: |
          echo "Validating HTML structures and formatting..."
          # This acts as a test placeholder to ensure HTML files are intact
          test -f public/index.html && echo "index.html exists and is valid."

      - name: Verify Docker Build Compatibility
        run: |
          echo "Testing Docker image construction..."
          docker build -t cs-department-website-test:latest .