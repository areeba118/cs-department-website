name: Continuous Integration (CI) Pipeline

# Trigger this automated pipeline on pushes or pull requests to development and main branches
on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  lint:
    name: HTML & CSS Code Quality Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # Uses an automated HTML linter tool to scan public folder files for syntax errors
      - name: Validate HTML Code Quality
        uses: htmlhint/htmlhint-action@v2
        with:
          bundle-only: true
          path: 'public/**/*.html'

  docker-test:
    name: Docker Container Compilation Test
    runs-on: ubuntu-latest
    needs: lint # Only run the Docker build test if our code linting step passes perfectly

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Compiles the Dockerfile locally within GitHub servers to ensure zero building defects
      - name: Test Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Do not upload/push the image anywhere yet, just verify compilation succeeds